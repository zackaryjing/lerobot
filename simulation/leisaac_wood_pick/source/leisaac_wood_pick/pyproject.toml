[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leisaac-wood-pick"
version = "0.1.0"
description = "SO-101 wood-pick digital twin built on LeIsaac and Isaac Lab"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["leisaac_wood_pick*"]
